name: UI自动化测试

# 触发条件：push 到 main 或创建 PR 时
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装 Python
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. 安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright pytest-playwright pyyaml pytest-html

      # 4. 安装 Playwright 浏览器
      - name: 安装 Playwright 浏览器
        run: playwright install chromium

      # 5. 跑测试（CI里没有若依后端，先标记为允许失败，不阻塞流水线）
      - name: 运行测试
        run: pytest tests/ -v --html=report.html --self-contained-html
        continue-on-error: true

      # 6. 上传测试报告（不管成功失败都上传）
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.html
